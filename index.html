<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Planner</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js",
    "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.23/build/index.module.js"
  }
}
</script>
</head>
<body>
<aside id="panel">
  <header>
    <h1>Panel Planner</h1>
    <p>Wall paneling, wainscoting and trim, rendered with real light.</p>
  </header>
  <div id="controls"></div>
</aside>
<main id="stage">
  <canvas id="view"></canvas>
  <div id="status"><span id="statusDot"></span><span id="statusText">Starting…</span></div>
  <div id="toolbar">
    <div id="views"></div>
    <div id="actions">
      <label class="tgl"><input type="checkbox" id="ptToggle" checked><span>Photoreal</span></label>
      <button id="saveBtn">Save image</button>
    </div>
  </div>
  <div id="error" hidden></div>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
